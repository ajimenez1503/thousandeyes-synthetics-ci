apiVersion: batch/v1
kind: Job
metadata:
  name: thousandeyes-post-change-validation
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 360
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: synthetics
          # Build, publish, and replace with your registry image digest.
          image: registry.example.com/thousandeyes-synthetics-ci@sha256:<image-digest>
          args: [run-tests, --config, /config/thousandeyes-ci.json, --timeout, 5m, --json]
          env:
            - name: TE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: thousandeyes-api
                  key: token
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: thousandeyes-canary-suite
